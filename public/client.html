<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twenty5Realty - Client Inquiry</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #0072bc;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --focus-ring: rgba(0, 114, 188, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      padding: 20px;
      box-sizing: border-box;
    }

    /* Top Bar Header */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .lang-toggle {
      display: flex;
      background: #e2e8f0;
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--primary-color);
      color: #ffffff;
    }

    /* Logo & Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-img {
      max-width: 180px;
      height: auto;
      margin-bottom: 12px;
    }

    .header h2 {
      margin: 0 0 4px 0;
      color: #0f172a;
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      margin: 0;
      font-size: 0.85rem;
      color: #64748b;
    }

    /* Section Title */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-color);
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.825rem;
      margin-bottom: 6px;
      color: #334155;
    }

    label .required {
      color: #ef4444;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      color: #0f172a;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .form-group {
      flex: 1;
    }

    button.submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 16px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    button.submit-btn:hover {
      background-color: #005a96;
    }

    button.submit-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Language Toggle Switcher -->
  <div class="top-bar">
    <div class="lang-toggle">
      <button type="button" class="lang-btn" id="btnKH" onclick="setLanguage('kh')">KH ខ្មែរ</button>
      <button type="button" class="lang-btn active" id="btnEN" onclick="setLanguage('en')">GB EN</button>
    </div>
  </div>

  <!-- Header Logo & Title -->
  <div class="header">
    <img src="/logo.png" alt="Twenty5Realty Logo" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/180x60?text=25Realty';">
    <h2>🔍 <span id="t_mainTitle">Client Inquiry</span></h2>
    <p id="t_subTitle">Client Property Requirement Form</p>
  </div>

  <form id="inquiryForm">
    <!-- Section 1: Client Info -->
    <div class="section-title">👤 <span id="t_secClient">Client Information</span></div>

    <div class="form-group">
      <label><span id="t_clientName">Client Name</span> <span class="required">*</span></label>
      <input type="text" id="clientName" name="clientName" placeholder="e.g. Chan Sokha" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label><span id="t_tel1">Phone Number 1</span> <span class="required">*</span></label>
        <input type="tel" id="tel1" name="tel1" placeholder="012 345 678" required>
      </div>
      <div class="form-group">
        <label><span id="t_tel2">Phone Number 2</span></label>
        <input type="tel" id="tel2" name="tel2" placeholder="098 765 432">
      </div>
    </div>

    <div class="form-group">
      <label><span id="t_telegram">Telegram Account</span></label>
      <input type="text" id="telegram" name="telegram" placeholder="@username or Phone Number">
    </div>

    <!-- Section 2: Property Preference -->
    <div class="section-title">🏠 <span id="t_secDetails">Property Preferences</span></div>

    <div class="row">
      <div class="form-group">
        <label><span id="t_listingType">Target</span> <span class="required">*</span></label>
        <select id="listingType" name="listingType" required onchange="toggleTypeFields()">
          <option value="Rent" id="opt_rent">Rent</option>
          <option value="Buy" id="opt_buy">Buy</option>
        </select>
      </div>
      <div class="form-group">
        <label><span id="t_propertyType">Property Type</span> <span class="required">*</span></label>
        <select id="propertyType" name="propertyType" required>
          <option value="House/Flat" id="opt_house">House / Flat</option>
          <option value="Villa" id="opt_villa">Villa</option>
          <option value="Condo" id="opt_condo">Condo</option>
          <option value="Apartment" id="opt_apartment">Apartment</option>
          <option value="Warehouse" id="opt_warehouse">Warehouse</option>
          <option value="Land" id="opt_land">Land</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label><span id="t_targetArea1">Target Area 1</span> <span class="required">*</span></label>
        <input type="text" id="targetArea1" name="targetArea1" placeholder="e.g. Toul Kork" required>
      </div>
      <div class="form-group">
        <label><span id="t_targetArea2">Target Area 2</span></label>
        <input type="text" id="targetArea2" name="targetArea2" placeholder="e.g. BKK1">
      </div>
    </div>

    <div class="form-group">
      <label><span id="t_targetArea3">Target Area 3</span></label>
      <input type="text" id="targetArea3" name="targetArea3" placeholder="e.g. Chroy Changvar">
    </div>

    <div class="row">
      <div class="form-group">
        <label><span id="t_budget">Budget ($)</span> <span class="required">*</span></label>
        <input type="number" id="budget" name="budget" placeholder="e.g. 500 or 120000" required>
      </div>
      <div class="form-group" id="preferredTermGroup">
        <label><span id="t_preferredTerm">Preferred Contract</span></label>
        <select id="preferredTerm" name="preferredTerm">
          <option value="6 Months" id="opt_term_6m">6 Months</option>
          <option value="1 Year" id="opt_term_1y" selected>1 Year</option>
          <option value="2+ Years" id="opt_term_2y">2+ Years</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label><span id="t_bedrooms">Bedrooms</span></label>
        <select id="bedrooms" name="bedrooms">
          <option value="Any" id="opt_bed_any">Any</option>
          <option value="Studio">Studio</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3+">3+</option>
        </select>
      </div>
      <div class="form-group">
        <label><span id="t_bathrooms">Bathrooms</span></label>
        <select id="bathrooms" name="bathrooms">
          <option value="Any" id="opt_bath_any">Any</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3+">3+</option>
        </select>
      </div>
    </div>

    <!-- Direction and Parking Needed Dropdowns -->
    <div class="row">
      <div class="form-group">
        <label><span id="t_direction">Direction</span></label>
        <select id="direction" name="direction">
          <option value="Not Required" id="opt_dir_none">Not Required</option>
          <option value="East" id="opt_dir_e">East</option>
          <option value="West" id="opt_dir_w">West</option>
          <option value="South" id="opt_dir_s">South</option>
          <option value="North" id="opt_dir_n">North</option>
          <option value="Northeast" id="opt_dir_ne">Northeast</option>
          <option value="Southeast" id="opt_dir_se">Southeast</option>
          <option value="Northwest" id="opt_dir_nw">Northwest</option>
          <option value="Southwest" id="opt_dir_sw">Southwest</option>
        </select>
      </div>
      <div class="form-group">
        <label><span id="t_parkingNeeded">Parking Needed</span></label>
        <select id="parkingNeeded" name="parkingNeeded">
          <option value="Not Required" id="opt_park_none">Not Required</option>
          <option value="Car" id="opt_park_car">Car</option>
          <option value="Motor" id="opt_park_motor">Motor</option>
          <option value="Both" id="opt_park_both">Both</option>
        </select>
      </div>
    </div>

    <!-- Purpose Dropdown & Conditional Business Type Input -->
    <div class="form-group">
      <label><span id="t_purpose">Rent/Buy Purpose</span> <span class="required">*</span></label>
      <select id="purpose" name="purpose" required onchange="togglePurposeFields()">
        <option value="For Living" id="opt_purpose_living">For Living</option>
        <option value="For Business" id="opt_purpose_business">For Business</option>
      </select>
    </div>

    <div class="form-group hidden" id="businessTypeGroup">
      <label><span id="t_businessType">Business Type</span> <span class="required">*</span></label>
      <input type="text" id="businessType" name="businessType" placeholder="e.g. Restaurant, Office, Coffee Shop">
    </div>

    <div class="form-group">
      <label><span id="t_description">Additional Requirements</span></label>
      <textarea id="description" name="description" rows="3" placeholder="e.g. High floor, pet friendly, fully furnished..."></textarea>
    </div>

    <!-- Hidden Submitter field -->
    <input type="hidden" id="submittedBy" name="submittedBy">

    <button type="submit" class="submit-btn" id="submitBtn">SUBMIT INQUIRY</button>
  </form>
</div>

      placeholderBusiness: "e.g. Restaurant, Office, Coffee Shop",
      placeholderDesc: "e.g. High floor, pet friendly, fully furnished...",
      optRent: "Rent",
      optBuy: "Buy",

      optDirN: "North",

      optParkCar: "Car",

      optParkBoth: "Both",

      targetArea3: "តំបន់គោលដៅ ទី៣",
      budget: "ថវិកា ($)",
      preferredTerm: "រយៈពេលកុងត្រា",
      bedrooms: "បន្ទប់គេង",
      bathrooms: "បន្ទប់ទឹក",
      direction: "បែរមុខទៅ",
      parkingNeeded: "ចំណត",
      purpose: "គោលបំណងជួល/ទិញ",

  let currentLang = 'en';

  function setLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];

    document.getElementById('btnKH').classList.toggle('active', lang === 'kh');
    document.getElementById('btnEN').classList.toggle('active', lang === 'en');

    document.getElementById('t_listingType').innerText = t.listingType;
    document.getElementById('t_propertyType').innerText = t.propertyType;

    document.getElementById('submitBtn').innerText = t.submitBtn;

    document.getElementById('clientName').placeholder = t.placeholderClient;
    document.getElementById('targetArea1').placeholder = t.placeholderArea1;
    document.getElementById('targetArea2').placeholder = t.placeholderArea2;
    document.getElementById('targetArea3').placeholder = t.placeholderArea3;

    document.getElementById('description').placeholder = t.placeholderDesc;

    // Dropdown Labels
    document.getElementById('opt_rent').innerText = t.optRent;

    document.getElementById('opt_house').innerText = t.optHouse;
    document.getElementById('opt_house').value = t.optHouse;

    document.getElementById('opt_apartment').value = t.optApartment;
    document.getElementById('opt_warehouse').innerText = t.optWarehouse;
    document.getElementById('opt_warehouse').value = t.optWarehouse;
    document.getElementById('opt_land').innerText = t.optLand;
    document.getElementById('opt_land').value = t.optLand;

    document.getElementById('opt_term_6m').innerText = t.optTerm6m;
    document.getElementById('opt_term_6m').value = t.optTerm6m;

    document.getElementById('opt_bed_any').innerText = t.optAny;
    document.getElementById('opt_bed_any').value = t.optAny;
    document.getElementById('opt_bath_any').innerText = t.optAny;
    document.getElementById('opt_bath_any').value = t.optAny;

    // Direction Dropdowns
    document.getElementById('opt_dir_none').innerText = t.optNotRequired;
    document.getElementById('opt_dir_none').value = t.optNotRequired;
    document.getElementById('opt_dir_e').innerText = t.optDirE;
    document.getElementById('opt_dir_e').value = t.optDirE;
    document.getElementById('opt_dir_w').innerText = t.optDirW;
    document.getElementById('opt_dir_w').value = t.optDirW;
    document.getElementById('opt_dir_s').innerText = t.optDirS;
    document.getElementById('opt_dir_s').value = t.optDirS;
    document.getElementById('opt_dir_n').innerText = t.optDirN;
    document.getElementById('opt_dir_n').value = t.optDirN;
    document.getElementById('opt_dir_ne').innerText = t.optDirNE;
    document.getElementById('opt_dir_ne').value = t.optDirNE;
    document.getElementById('opt_dir_se').innerText = t.optDirSE;
    document.getElementById('opt_dir_se').value = t.optDirSE;
    document.getElementById('opt_dir_nw').innerText = t.optDirNW;
    document.getElementById('opt_dir_nw').value = t.optDirNW;
    document.getElementById('opt_dir_sw').innerText = t.optDirSW;
    document.getElementById('opt_dir_sw').value = t.optDirSW;

    // Parking Dropdowns
    document.getElementById('opt_park_none').innerText = t.optNotRequired;
    document.getElementById('opt_park_none').value = t.optNotRequired;
    document.getElementById('opt_park_car').innerText = t.optParkCar;
    document.getElementById('opt_park_car').value = t.optParkCar;
    document.getElementById('opt_park_motor').innerText = t.optParkMotor;
    document.getElementById('opt_park_motor').value = t.optParkMotor;
    document.getElementById('opt_park_both').innerText = t.optParkBoth;
    document.getElementById('opt_park_both').value = t.optParkBoth;

    document.getElementById('opt_purpose_living').innerText = t.optPurposeLiving;
    document.getElementById('opt_purpose_living').value = t.optPurposeLiving;
    document.getElementById('opt_purpose_business').innerText = t.optPurposeBusiness;
    document.getElementById('opt_purpose_business').value = t.optPurposeBusiness;
  }

  // Context user extraction
  window.addEventListener('DOMContentLoaded', () => {
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      const name = `${u.first_name || ''} ${u.last_name || ''}`.trim();
      const username = u.username ? `(@${u.username})` : '';
      document.getElementById('submittedBy').value = `${name} ${username}`.trim();
    } else {
      document.getElementById('submittedBy').value = 'Agent/Client (Web Direct)';
    }
  });

  // Toggle field visibility when Buy / Rent changes
  function toggleTypeFields() {
    const listingType = document.getElementById('listingType').value;
    const termGroup = document.getElementById('preferredTermGroup');
    if (listingType === 'Buy' || listingType === 'ទិញ') {
      termGroup.classList.add('hidden');
    } else {
      termGroup.classList.remove('hidden');
    }
  }

  // Toggle Purpose / Business Type conditional field
  function togglePurposeFields() {
    const purpose = document.getElementById('purpose').value;
    const busGroup = document.getElementById('businessTypeGroup');
    const busInput = document.getElementById('businessType');

    if (purpose === 'For Business' || purpose === 'សម្រាប់ធ្វើអាជីវកម្ម') {
      busGroup.classList.remove('hidden');
      busInput.required = true;
    } else {
      busGroup.classList.add('hidden');
      busInput.required = false;
      busInput.value = '';
    }
  }

  // Form Submit Handler
  document.getElementById('inquiryForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = currentLang === 'kh' ? 'កំពុងបញ្ជូន...' : 'SUBMITTING...';

    // Build combined Target Area string for backend compatibility
    const area1 = document.getElementById('targetArea1')?.value.trim() || '';
    const area2 = document.getElementById('targetArea2')?.value.trim() || '';
    const area3 = document.getElementById('targetArea3')?.value.trim() || '';
    const combinedAreas = [area1, area2, area3].filter(Boolean).join(', ');

    const purposeVal = document.getElementById('purpose')?.value || '';
    const busTypeVal = document.getElementById('businessType')?.value.trim() || '';
    const combinedPurpose = (purposeVal === 'For Business' || purposeVal === 'សម្រាប់ធ្វើអាជីវកម្ម') && busTypeVal 
      ? `${purposeVal} (${busTypeVal})` 
      : purposeVal;

    const payload = {
      clientName: document.getElementById('clientName')?.value || '',
      tel1: document.getElementById('tel1')?.value || '',
      tel2: document.getElementById('tel2')?.value || '',
      telegram: document.getElementById('telegram')?.value || '',
      listingType: document.getElementById('listingType')?.value || '',
      propertyType: document.getElementById('propertyType')?.value || '',
      targetLocation: combinedAreas,
      budget: document.getElementById('budget')?.value || '',
      preferredTerm: document.getElementById('preferredTerm')?.value || '',
      bedrooms: document.getElementById('bedrooms')?.value || '',
      bathrooms: document.getElementById('bathrooms')?.value || '',
      direction: document.getElementById('direction')?.value || '',
      parkingNeeded: document.getElementById('parkingNeeded')?.value || '',
      purpose: combinedPurpose,
      description: document.getElementById('description')?.value || '',
      submittedBy: document.getElementById('submittedBy')?.value || ''
    };

    try {
      const response = await fetch('/api/client-inquiry', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const contentType = response.headers.get('content-type');
      if (!contentType || !contentType.includes('application/json')) {
        throw new Error('Server returned non-JSON response.');
      }

      const result = await response.json();

      if (result.success) {
        const msg = currentLang === 'kh' ? 'ទិន្នន័យត្រូវបានបញ្ជូនជោគជ័យ!' : 'Inquiry submitted successfully!';
        if (tg && tg.showAlert) {
          tg.showAlert(msg, () => { tg.close(); });
        } else {
          alert(msg);
          this.reset();
          togglePurposeFields();
        }
      } else {
        alert('Error: ' + (result.error || 'Please try again.'));
      }
    } catch (err) {
      console.error(err);
      alert('Error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = translations[currentLang].submitBtn;
    }
  });
</script>

</body>
</html>
