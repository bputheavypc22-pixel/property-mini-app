<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Client Property Requirement Form | Twenty5Realty</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 12px;
      color: #1f2937;
    }
    .form-card {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
    }
    .lang-switcher {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      gap: 2px;
      background: #e2e8f0;
      padding: 2px;
      border-radius: 20px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      color: #475569;
    }
    .lang-btn.active {
      background: #0284c7;
      color: #ffffff;
    }
    .logo {
      max-width: 140px;
      height: auto;
      margin-top: 20px;
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      margin: 8px 0 2px 0;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #334155;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0284c7;
      background: #ffffff;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .col {
      flex: 1;
    }
    .btn-submit-main {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Summary Confirmation View */
    #successCard {
      display: none;
      background: #ffffff;
      border-radius: 12px;
    }
    .success-badge {
      text-align: center;
      color: #16a34a;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .summary-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #e2e8f0;
      color: #1e293b;
    }

    /* Action Buttons Group */
    .action-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      width: 100%;
    }
    .action-btn-group button {
      flex: 1;
      padding: 12px 10px;
      font-weight: 700;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    .btn-new-sub {
      background-color: #5a738e;
      color: #ffffff;
    }
    .btn-close {
      background-color: #cbd5e1;
      color: #334155;
    }
  </style>
</head>
<body>

<div class="form-card">
  <div class="header" id="headerBlock">
    <div class="lang-switcher">
      <button type="button" class="lang-btn active" id="langKh" onclick="setLanguage('kh')">KH ខ្មែរ</button>
      <button type="button" class="lang-btn" id="langEn" onclick="setLanguage('en')">GB EN</button>
    </div>
    <img src="https://twenty5realty.com/logo.png" alt="25Realty Logo" class="logo" onerror="this.style.display='none'">
    <div class="title">🔍 Client Inquiry</div>
    <div class="subtitle">Client Property Requirement Form</div>
  </div>

  <form id="clientForm" onsubmit="submitForm(event)">
    <div class="row">
      <div class="col form-group">
        <label>Property Type / ប្រភេទ</label>
        <select id="propertyType" required>
          <option value="ផ្ទះ">ផ្ទះ / House</option>
          <option value="ដី">ដី / Land</option>
          <option value="ខុនដូ">ខុនដូ / Condo</option>
          <option value="អាគារ">អាគារ / Building</option>
          <option value="ឃ្លាំង">ឃ្លាំង / Warehouse</option>
        </select>
      </div>
      <div class="col form-group">
        <label>Target / គោលបំណង</label>
        <select id="listingType" required>
          <option value="ជួល">ជួល / Rent</option>
          <option value="ទិញ">ទិញ / Buy</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Target Location / តំបន់គោលដៅ</label>
      <input type="text" id="targetLocation" placeholder="e.g. tk, bkk, sensok" required>
    </div>

    <div class="row">
      <div class="col form-group">
        <label>Budget ($) / តម្លៃចន្លោះ</label>
        <input type="number" id="budget" placeholder="500" required>
      </div>
      <div class="col form-group">
        <label>Contract / អាចកុងត្រា</label>
        <input type="text" id="preferredTerm" placeholder="1 Year">
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label>Bedrooms / បន្ទប់គេង</label>
        <input type="text" id="bedrooms" placeholder="1">
      </div>
      <div class="col form-group">
        <label>Bathrooms / បន្ទប់ទឹក</label>
        <input type="text" id="bathrooms" placeholder="2">
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label>Direction / ទិសបែរមុខទៅ</label>
        <input type="text" id="direction" placeholder="West / កើតឈៀងជើង">
      </div>
      <div class="col form-group">
        <label>Parking / ត្រូវការចំណត</label>
        <input type="text" id="parking" placeholder="Car / ឡាន">
      </div>
    </div>

    <div class="form-group">
      <label>Purpose / គោលបំណង</label>
      <input type="text" id="purpose" placeholder="For Business (លក់វត្ថុអានុស្សាវរីយ៍)">
    </div>

    <div class="form-group">
      <label>Special Notes / សម្គាល់បន្ថែម</label>
      <textarea id="description" rows="3" placeholder="សម្គាល់បន្ថែម..."></textarea>
    </div>

    <hr style="border:0; border-top: 1px solid #e2e8f0; margin: 14px 0;">

    <div class="form-group">
      <label>Client Name / ឈ្មោះអតិថិជន</label>
      <input type="text" id="clientName" placeholder="Test Client" required>
    </div>

    <div class="row">
      <div class="col form-group">
        <label>Tel 1 / លេខទូរស័ព្ទ</label>
        <input type="text" id="tel1" placeholder="09987654" required>
      </div>
      <div class="col form-group">
        <label>Tel 2 / លេខបន្ថែម</label>
        <input type="text" id="tel2" placeholder="0123456789">
      </div>
    </div>

    <div class="form-group">
      <label>Telegram / តេឡេក្រាម</label>
      <input type="text" id="telegram" placeholder="09876543">
    </div>

    <button type="submit" class="btn-submit-main" id="btnSubmit">SUBMIT INQUIRY</button>
  </form>

  <div id="successCard">
    <div class="success-badge">✅ Submitted Successfully!</div>
    <div class="summary-box" id="summaryContainer"></div>

    <div class="action-btn-group">
      <button type="button" class="btn-new-sub" onclick="resetForm()">NEW SUBMISSION</button>
      <button type="button" class="btn-close" onclick="closeWebApp()">CLOSE</button>
    </div>
  </div>
</div>

<script>
  let tgUser = null;
  let tgUserName = "Sir Jerry (@Putheavy_25Realty)";

  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    
    tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    if (tgUser) {
      const firstName = tgUser.first_name || '';
      const lastName = tgUser.last_name || '';
      const username = tgUser.username ? ` (@${tgUser.username})` : '';
      tgUserName = `${firstName} ${lastName}${username}`.trim();
    }
  }

  function setLanguage(lang) {
    document.getElementById('langKh').classList.toggle('active', lang === 'kh');
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
  }

  async function submitForm(e) {
    e.preventDefault();
    const btnSubmit = document.getElementById('btnSubmit');
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Submitting...";

    const payload = {
      propertyType: document.getElementById('propertyType').value,
      listingType: document.getElementById('listingType').value,
      targetLocation: document.getElementById('targetLocation').value,
      budget: document.getElementById('budget').value,
      preferredTerm: document.getElementById('preferredTerm').value,
      bedrooms: document.getElementById('bedrooms').value,
      bathrooms: document.getElementById('bathrooms').value,
      direction: document.getElementById('direction').value,
      parkingNeeded: document.getElementById('parking').value,
      purpose: document.getElementById('purpose').value,
      description: document.getElementById('description').value,
      clientName: document.getElementById('clientName').value,
      tel1: document.getElementById('tel1').value,
      tel2: document.getElementById('tel2').value,
      telegram: document.getElementById('telegram').value,
      submittedBy: tgUserName,
      userId: tgUser ? tgUser.id : null
    };

    try {
      const response = await fetch('/api/client-inquiry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const res = await response.json();

      if (res.success) {
        showSuccessSummary(payload);
      } else {
        alert("Error: " + (res.error || "Failed to submit inquiry"));
      }
    } catch (err) {
      alert("Network Error: Could not reach server.");
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "SUBMIT INQUIRY";
    }
  }

  function showSuccessSummary(data) {
    document.getElementById('clientForm').style.display = 'none';
    document.getElementById('headerBlock').style.display = 'none';
    
    const phoneDisplay = data.tel2 ? `${data.tel1} / ${data.tel2}` : data.tel1;
    const now = new Date();
    const formattedDate = now.toLocaleString('en-GB', { timeZone: 'Asia/Phnom_Penh' });

    const summaryHTML = 
`👤 ការចុះបញ្ជីតម្រូវការអតិថិជន (NEW CLIENT INQUIRY)

🔍 ភ្ញៀវកំពុងស្វែងរក
🏠 ${data.propertyType} ${data.listingType}
📍 តំបន់គោលដៅ: ${data.targetLocation}
• តម្លៃចន្លោះ : $${data.budget}
• អាចកុងត្រា : ${data.preferredTerm || 'N/A'}
• ចំនួនបន្ទប់ : 🛏គេង: ${data.bedrooms || 'N/A'} | 🚿 ទឹក: ${data.bathrooms || 'N/A'}
• ទិសបែរមុខទៅ : ${data.direction || 'N/A'}
• ត្រូវការចំណត : ${data.parkingNeeded || 'N/A'}
• គោលបំណង : ${data.purpose || 'N/A'}

📝 សម្គាល់បន្ថែម / Special Notes:
${data.description || 'N/A'}

-----------------------------------
👤 ព័ត៌មានអតិថិជន
• ឈ្មោះ : ${data.clientName}
• លេខទូរស័ព្ទ : ${phoneDisplay}
• Telegram : ${data.telegram || 'N/A'}

Submitted by: ${data.submittedBy}
Submitted Date: ${formattedDate}`;

    document.getElementById('summaryContainer').innerText = summaryHTML;
    document.getElementById('successCard').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeWebApp() {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.close();
    } else {
      window.close();
    }
  }

  function resetForm() {
    document.getElementById('clientForm').reset();
    document.getElementById('successCard').style.display = 'none';
    document.getElementById('headerBlock').style.display = 'block';
    document.getElementById('clientForm').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
