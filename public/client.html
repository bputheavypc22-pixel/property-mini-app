<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Client Requirement - Twenty5 Realty</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #0d253f);
      padding: 16px;
      padding-bottom: 30px;
    }
    .header {
      position: relative;
      text-align: center;
      margin-bottom: 20px;
      margin-top: 10px;
    }
    .lang-switcher {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      gap: 4px;
      background: var(--tg-theme-secondary-bg-color, #f1f5f9);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid var(--tg-theme-hint-color, #cbd5e1);
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      color: var(--tg-theme-text-color, #64748b);
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: var(--tg-theme-button-color, #0056b3);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .logo-img {
      max-width: 140px;
      height: auto;
      margin-bottom: 12px;
      border-radius: 8px;
    }
    .header h2 {
      font-size: 20px;
      color: var(--tg-theme-text-color, #0b2545);
      margin-bottom: 4px;
    }
    .header p {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #134074);
    }
    .section-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--tg-theme-link-color, #0b2545);
      margin: 20px 0 10px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--tg-theme-hint-color, #8da9c4);
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--tg-theme-text-color, #0b2545);
    }
    input[type="text"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--tg-theme-hint-color, #cbd5e1);
      background-color: var(--tg-theme-secondary-bg-color, #f8fafc);
      color: var(--tg-theme-text-color, #003566);
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder,
    textarea::placeholder {
      color: var(--tg-theme-hint-color, #4682b4);
      opacity: 0.7;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--tg-theme-button-color, #0056b3);
      box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="lang-switcher">
      <button type="button" class="lang-btn active" id="btn-km" onclick="switchLanguage('km')">🇰🇭 ខ្មែរ</button>
      <button type="button" class="lang-btn" id="btn-en" onclick="switchLanguage('en')">🇬🇧 EN</button>
    </div>
    <img src="25logo.png" alt="Twenty5 Realty Logo" class="logo-img">
    <h2 id="header-title">🔍 តម្រូវការស្វែងរកអចលនទ្រព្យ</h2>
    <p id="header-subtitle">Client Property Inquiry Form</p>
  </div>

  <form id="clientForm">
    <!-- Client Info -->
    <div class="section-title" id="sec-client">👤 ព័ត៌មានអតិថិជន / Client Info</div>

    <div class="form-group">
      <label id="lbl-name">ឈ្មោះអតិថិជន / Client Name</label>
      <input type="text" id="name" data-ph-km="ឧ. លី សុខ" data-ph-en="e.g. Ly Sok">
    </div>

    <div class="form-group">
      <label id="lbl-tel1">លេខទូរស័ព្ទទី១ / Phone 1 *</label>
      <input type="tel" id="tel1" required placeholder="012 345 678">
    </div>

    <div class="form-group">
      <label id="lbl-tel2">លេខទូរស័ព្ទទី២ / Phone 2</label>
      <input type="tel" id="tel2" placeholder="098 765 432">
    </div>

    <div class="form-group">
      <label id="lbl-clientTelegram">Telegram អតិថិជន / Client Telegram</label>
      <input type="text" id="clientTelegram" data-ph-km="@username ឬ លេខទូរស័ព្ទ" data-ph-en="@username or Phone Number">
    </div>

    <!-- Inquiry Details -->
    <div class="section-title" id="sec-requirement">🎯 តម្រូវការអចលនទ្រព្យ / Property Requirement</div>

    <div class="form-group">
      <label id="lbl-target">តម្រូវការ / Looking For *</label>
      <select id="target" required>
        <option value="" class="opt-select">-- ជ្រើសរើស / Select --</option>
        <option value="ទិញ / Buy">ទិញ / Buy</option>
        <option value="ជួល / Rent">ជួល / Rent</option>
        <option value="ទិញ ឬ ជួល / Buy or Rent">ទិញ ឬ ជួល / Buy or Rent</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-propertyType">ប្រភេទអចលនទ្រព្យ / Property Type *</label>
      <select id="propertyType" required>
        <option value="" class="opt-select">-- ជ្រើសរើស / Select --</option>
        <option value="ផ្ទះល្វែង / Flat House">ផ្ទះល្វែង / Flat House</option>
        <option value="វីឡា / Villa">វីឡា / Villa</option>
        <option value="ខុនដូ / Condo">ខុនដូ / Condo</option>
        <option value="ដី / Land">ដី / Land</option>
        <option value="ឃ្លាំង / Warehouse">ឃ្លាំង / Warehouse</option>
        <option value="អាជីវកម្ម / Business">អាជីវកម្ម / Business</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-budget">ថវិកា / Budget *</label>
      <input type="text" id="budget" required data-ph-km="ឧ. $100,000 - $150,000 ឬ $500/ខែ" data-ph-en="e.g. $100,000 - $150,000 or $500/month">
    </div>

    <div class="form-group">
      <label id="lbl-preferredLocation">តំបន់/ទីតាំងដែលចង់បាន / Preferred Location *</label>
      <input type="text" id="preferredLocation" required data-ph-km="ឧ. ទួលគោក, បឹងកេងកង, ឬ ផ្លូវ 271" data-ph-en="e.g. Toul Kork, BKK1, or St. 271">
    </div>

    <div class="form-group">
      <label id="lbl-buildingSize">ទំហំអគារដែលចង់បាន / Preferred Building Size</label>
      <input type="text" id="buildingSize" data-ph-km="ឧ. យ៉ាងហោចណាស់ 4m x 16m" data-ph-en="e.g. Min 4m x 16m">
    </div>

    <div class="form-group">
      <label id="lbl-landSize">ទំហំដីដែលចង់បាន / Preferred Land Size</label>
      <input type="text" id="landSize" data-ph-km="ឧ. 5m x 20m" data-ph-en="e.g. 5m x 20m">
    </div>

    <div class="form-group">
      <label id="lbl-bedrooms">ចំនួនបន្ទប់គេង / Bedrooms</label>
      <select id="bedrooms">
        <option value="មិនទាមទារ / Any">-- ជ្រើសរើស / Select --</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5+">5+</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-bathrooms">ចំនួនបន្ទប់ទឹក / Bathrooms</label>
      <select id="bathrooms">
        <option value="មិនទាមទារ / Any">-- ជ្រើសរើស / Select --</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5+">5+</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-direction">ទិសដែលចង់បាន / Preferred Direction</label>
      <select id="direction">
        <option value="ទិសណាក៏បាន / Any">-- ជ្រើសរើស / Select --</option>
        <option value="កើត / East">កើត / East</option>
        <option value="លិច / West">លិច / West</option>
        <option value="ត្បូង / South">ត្បូង / South</option>
        <option value="ជើង / North">ជើង / North</option>
        <option value="កើតត្បូង / SE">កើតត្បូង / SE</option>
        <option value="កើតជើង / NE">កើតជើង / NE</option>
        <option value="លិចត្បូង / SW">លិចត្បូង / SW</option>
        <option value="លិចជើង / NW">លិចជើង / NW</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-urgentLevel">កម្រិតប្រញាប់ / Urgency Level</label>
      <select id="urgentLevel">
        <option value="ធម្មតា / Normal">ធម្មតា / Normal</option>
        <option value="ប្រញាប់ / Urgent">ប្រញាប់ / Urgent</option>
        <option value="ប្រញាប់ខ្លាំង / Very Urgent">ប្រញាប់ខ្លាំង / Very Urgent</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-remark">ចំណង់ចំណូលចិត្ត/តម្រូវការបន្ថែម / Additional Requirements</label>
      <textarea id="remark" data-ph-km="ឧ. ចង់បានផ្ទះជាប់ផ្លូវធំ, មានសម្ភារៈពេញ..." data-ph-en="e.g. Main road access, Fully furnished..."></textarea>
    </div>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    let currentLang = localStorage.getItem('appLang') || 'km';

    const translations = {
      km: {
        headerTitle: "🔍 តម្រូវការស្វែងរកអចលនទ្រព្យ",
        headerSubtitle: "ទម្រង់បែបបទស្នើសុំស្វែងរកអចលនទ្រព្យ",
        secClient: "👤 ព័ត៌មានអតិថិជន",
        lblName: "ឈ្មោះអតិថិជន",
        lblTel1: "លេខទូរស័ព្ទទី១ *",
        lblTel2: "លេខទូរស័ព្ទទី២",
        lblClientTelegram: "Telegram អតិថិជន",
        secRequirement: "🎯 តម្រូវការអចលនទ្រព្យ",
        lblTarget: "តម្រូវការ *",
        lblPropertyType: "ប្រភេទអចលនទ្រព្យ *",
        lblBudget: "ថវិកា *",
        lblPreferredLocation: "តំបន់/ទីតាំងដែលចង់បាន *",
        lblBuildingSize: "ទំហំអគារដែលចង់បាន",
        lblLandSize: "ទំហំដីដែលចង់បាន",
        lblBedrooms: "ចំនួនបន្ទប់គេង",
        lblBathrooms: "ចំនួនបន្ទប់ទឹក",
        lblDirection: "ទិសដែលចង់បាន",
        lblUrgentLevel: "កម្រិតប្រញាប់",
        lblRemark: "ចំណង់ចំណូលចិត្ត/តម្រូវការបន្ថែម",
        submitBtn: "បញ្ជូនតម្រូវការ",
        successAlert: "លោកអ្នកបានផ្ញើតម្រូវការស្វែងរកជោគជ័យ! 🎉"
      },
      en: {
        headerTitle: "🔍 Client Property Inquiry",
        headerSubtitle: "Client Property Requirement Form",
        secClient: "👤 Client Information",
        lblName: "Client Name",
        lblTel1: "Phone Number 1 *",
        lblTel2: "Phone Number 2",
        lblClientTelegram: "Client Telegram",
        secRequirement: "🎯 Property Requirement",
        lblTarget: "Looking For *",
        lblPropertyType: "Property Type *",
        lblBudget: "Budget *",
        lblPreferredLocation: "Preferred Location *",
        lblBuildingSize: "Preferred Building Size",
        lblLandSize: "Preferred Land Size",
        lblBedrooms: "Bedrooms",
        lblBathrooms: "Bathrooms",
        lblDirection: "Preferred Direction",
        lblUrgentLevel: "Urgency Level",
        lblRemark: "Additional Requirements",
        submitBtn: "SUBMIT INQUIRY",
        successAlert: "Inquiry submitted successfully! 🎉"
      }
    };

    function switchLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('appLang', lang);

      // Active button styling
      document.getElementById('btn-km').classList.toggle('active', lang === 'km');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      const t = translations[lang];

      // Update text elements
      document.getElementById('header-title').textContent = t.headerTitle;
      document.getElementById('header-subtitle').textContent = t.headerSubtitle;
      document.getElementById('sec-client').textContent = t.secClient;
      document.getElementById('lbl-name').textContent = t.lblName;
      document.getElementById('lbl-tel1').textContent = t.lblTel1;
      document.getElementById('lbl-tel2').textContent = t.lblTel2;
      document.getElementById('lbl-clientTelegram').textContent = t.lblClientTelegram;
      document.getElementById('sec-requirement').textContent = t.secRequirement;
      document.getElementById('lbl-target').textContent = t.lblTarget;
      document.getElementById('lbl-propertyType').textContent = t.lblPropertyType;
      document.getElementById('lbl-budget').textContent = t.lblBudget;
      document.getElementById('lbl-preferredLocation').textContent = t.lblPreferredLocation;
      document.getElementById('lbl-buildingSize').textContent = t.lblBuildingSize;
      document.getElementById('lbl-landSize').textContent = t.lblLandSize;
      document.getElementById('lbl-bedrooms').textContent = t.lblBedrooms;
      document.getElementById('lbl-bathrooms').textContent = t.lblBathrooms;
      document.getElementById('lbl-direction').textContent = t.lblDirection;
      document.getElementById('lbl-urgentLevel').textContent = t.lblUrgentLevel;
      document.getElementById('lbl-remark').textContent = t.lblRemark;

      // Update Placeholders
      document.querySelectorAll('[data-ph-km]').forEach(el => {
        el.placeholder = el.getAttribute(`data-ph-${lang}`);
      });

      // Update Telegram Main Button Text
      if (tg && tg.MainButton) {
        tg.MainButton.setText(t.submitBtn);
      }
    }

    if (tg) {
      tg.ready();
      tg.expand();

      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
          window.location.href = 'index.html';
        });
      }

      tg.MainButton.show();
    }

    const submitForm = async () => {
      const t = translations[currentLang];
      const form = document.getElementById('clientForm');
      
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (tg) tg.MainButton.showProgress();

      const user = tg?.initDataUnsafe?.user;
      const submittedBy = user ? `${user.first_name || ''} ${user.last_name || ''} (@${user.username || 'no_username'})`.trim() : 'Web User';

      const payload = {
        name: document.getElementById('name').value,
        tel1: document.getElementById('tel1').value,
        tel2: document.getElementById('tel2').value,
        clientTelegram: document.getElementById('clientTelegram').value,
        target: document.getElementById('target').value,
        propertyType: document.getElementById('propertyType').value,
        budget: document.getElementById('budget').value,
        preferredLocation: document.getElementById('preferredLocation').value,
        buildingSize: document.getElementById('buildingSize').value,
        landSize: document.getElementById('landSize').value,
        bedrooms: document.getElementById('bedrooms').value,
        bathrooms: document.getElementById('bathrooms').value,
        direction: document.getElementById('direction').value,
        urgentLevel: document.getElementById('urgentLevel').value,
        remark: document.getElementById('remark').value,
        submittedBy: submittedBy,
        initData: tg?.initData || ''
      };

      try {
        const response = await fetch('/api/client-inquiry', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (tg) tg.MainButton.hideProgress();

        if (result.success) {
          if (tg) {
            tg.showAlert(t.successAlert, () => {
              tg.close();
            });
          } else {
            alert(t.successAlert);
            location.reload();
          }
        } else {
          throw new Error(result.error || 'Submission failed');
        }
      } catch (err) {
        if (tg) tg.MainButton.hideProgress();
        tg?.showAlert ? tg.showAlert('Error: ' + err.message) : alert('Error: ' + err.message);
      }
    };

    if (tg) {
      tg.MainButton.onClick(submitForm);
    } else {
      document.getElementById('clientForm').addEventListener('submit', (e) => {
        e.preventDefault();
        submitForm();
      });
    }

    // Initialize Language on Load
    switchLanguage(currentLang);
  </script>
</body>
</html>
