<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Listing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Property Listing Form</h2>

  <form id="propertyForm">
    <div class="form-group">
      <label for="name">Owner Name:</label>
      <input type="text" id="name" name="name" required />
    </div>

    <div class="form-group">
      <label for="tel1">Phone 1:</label>
      <input type="text" id="tel1" name="tel1" required />
    </div>

    <div class="form-group">
      <label for="tel2">Phone 2:</label>
      <input type="text" id="tel2" name="tel2" />
    </div>

    <div class="form-group">
      <label for="clientTelegram">Owner Telegram:</label>
      <input type="text" id="clientTelegram" name="clientTelegram" />
    </div>

    <div class="form-group">
      <label for="target">Target:</label>
      <input type="text" id="target" name="target" />
    </div>

    <div class="form-group">
      <label for="propertyType">Property Type:</label>
      <input type="text" id="propertyType" name="propertyType" />
    </div>

    <div class="form-group">
      <label for="price">Price:</label>
      <input type="text" id="price" name="price" />
    </div>

    <div class="form-group">
      <label for="location">Location Link:</label>
      <input type="text" id="location" name="location" />
    </div>

    <div class="form-group">
      <label for="buildingSize">Building Size:</label>
      <input type="text" id="buildingSize" name="buildingSize" />
    </div>

    <div class="form-group">
      <label for="landSize">Land Size:</label>
      <input type="text" id="landSize" name="landSize" />
    </div>

    <div class="form-group">
      <label for="bedrooms">Bedrooms:</label>
      <input type="text" id="bedrooms" name="bedrooms" />
    </div>

    <div class="form-group">
      <label for="bathrooms">Bathrooms:</label>
      <input type="text" id="bathrooms" name="bathrooms" />
    </div>

    <div class="form-group">
      <label for="direction">Direction:</label>
      <input type="text" id="direction" name="direction" />
    </div>

    <!-- Parking Space Dropdown Option -->
    <div class="form-group">
      <label for="parking">Parking Space:</label>
      <select id="parking" name="parking">
        <option value="" disabled selected>Select Parking Option</option>
        <option value="Not Available">Not Available</option>
        <option value="Available for Car">Available for Car</option>
        <option value="Moto Only">Moto Only</option>
      </select>
    </div>

    <div class="form-group">
      <label for="paymentTerm">Payment Term:</label>
      <input type="text" id="paymentTerm" name="paymentTerm" />
    </div>

    <div class="form-group">
      <label for="deposit">Deposit:</label>
      <input type="text" id="deposit" name="deposit" />
    </div>

    <div class="form-group">
      <label for="contract">Contract:</label>
      <input type="text" id="contract" name="contract" />
    </div>

    <div class="form-group">
      <label for="remark">Remark:</label>
      <textarea id="remark" name="remark"></textarea>
    </div>

    <div class="form-group">
      <label for="photos">Photos:</label>
      <input type="file" id="photos" name="photos" multiple />
    </div>

    <button type="submit">Submit Property</button>
  </form>

  <script>
    document.getElementById('propertyForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);

      try {
        const response = await fetch('/api/register-property', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (result.success) {
          alert('Property registered successfully!');
          this.reset();
        } else {
          alert('Failed to register property.');
        }
      } catch (err) {
        console.error(err);
        alert('An error occurred.');
      }
    });
  </script>
</body>
</html>
