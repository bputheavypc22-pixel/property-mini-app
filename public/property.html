<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Twenty5Realty - Add Listing</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --primary-color: #0088cc;
      --border-color: #dcdfe6;
      --focus-color: #0088cc;
      --danger-color: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .lang-switcher {
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .required {
      color: var(--danger-color);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--focus-color);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .photo-upload-container {
      border: 2px dashed var(--border-color);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      background: #fafafa;
    }

    .photo-preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(231, 76, 60, 0.85);
      color: white;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0, 136, 204, 0.3);
    }

    .submit-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h2 id="pageTitle">បន្ថែមអចលនទ្រព្យ</h2>
      <div class="lang-switcher">
        <button type="button" class="lang-btn active" id="btnKm" onclick="switchLanguage('km')">ខ្មែរ</button>
        <button type="button" class="lang-btn" id="btnEn" onclick="switchLanguage('en')">EN</button>
      </div>
    </div>

    <form id="listingForm" onsubmit="event.preventDefault(); submitForm();">
      
      <!-- User Contact Information -->
      <div class="card">
        <div class="form-group">
          <label><span id="lblOwnerName">ឈ្មោះម្ចាស់អចលនទ្រព្យ</span> <span class="required">*</span></label>
          <input type="text" id="ownerName" required />
        </div>
        <div class="form-group">
          <label><span id="lblTel1">លេខទូរស័ព្ទទី១</span> <span class="required">*</span></label>
          <input type="tel" id="tel1" required />
        </div>
        <div class="form-group">
          <label id="lblTel2">លេខទូរស័ព្ទទី២ (បើមាន)</label>
          <input type="tel" id="tel2" />
        </div>
        <div class="form-group">
          <label id="lblTelegram">Telegram (បើមាន)</label>
          <input type="text" id="telegram" placeholder="@username ឬ លេខទូរស័ព្ទ" />
        </div>
      </div>

      <!-- Property Info -->
      <div class="card">
        <div class="form-group">
          <label><span id="lblListingType">ប្រភេទប្រតិបត្តិការ</span> <span class="required">*</span></label>
          <select id="listingType" onchange="handleListingTypeChange()" required>
            <option value="លក់" selected>លក់ (Sale)</option>
            <option value="ជួល">ជួល (Rent)</option>
          </select>
        </div>

        <div class="form-group">
          <label><span id="lblPropertyType">ប្រភេទអចលនទ្រព្យ</span> <span class="required">*</span></label>
          <select id="propertyType" required>
            <option value="ផ្ទះ/វីឡា">ផ្ទះ / វីឡា</option>
            <option value="ដី">ដី</option>
            <option value="ខុនដូ/អាផាតមិន">ខុនដូ / អាផាតមិន</option>
            <option value="ឃ្លាំង/រោងចក្រ">ឃ្លាំង / រោងចក្រ</option>
          </select>
        </div>

        <div class="form-group">
          <label><span id="lblPrice">តម្លៃ ($)</span> <span class="required">*</span></label>
          <input type="number" id="price" step="any" required />
        </div>

        <div class="form-group">
          <label><span id="lblLocation">ទីតាំង / តំបន់</span> <span class="required">*</span></label>
          <input type="text" id="location" required />
        </div>

        <div class="form-group">
          <label id="lblMapLink">តំណភ្ជាប់ Google Map</label>
          <input type="url" id="mapLink" placeholder="https://maps.app.goo.gl/..." />
        </div>
      </div>

      <!-- Property Details -->
      <div class="card">
        <div class="form-group">
          <label id="lblLandSize">ទំហំដី (m²)</label>
          <input type="text" id="landSize" placeholder="ឧទាហរណ៍: 10m x 20m" />
        </div>

        <div class="form-group">
          <label id="lblHouseSize">ទំហំផ្ទះ (m²)</label>
          <input type="text" id="houseSize" placeholder="ឧទាហរណ៍: 8m x 15m" />
        </div>

        <div class="form-group">
          <label id="lblFrontSpace">ដីសល់ខាងមុខ</label>
          <input type="text" id="frontSpace" placeholder="ឧទាហរណ៍: 5m" />
        </div>

        <div class="form-group">
          <label id="lblBackSpace">ដីសល់ខាងក្រោយ</label>
          <input type="text" id="backSpace" placeholder="ឧទាហរណ៍: 2m" />
        </div>

        <div class="form-group">
          <label id="lblBedrooms">បន្ទប់គេង</label>
          <input type="number" id="bedrooms" min="0" />
        </div>

        <div class="form-group">
          <label id="lblBathrooms">បន្ទប់ទឹក</label>
          <input type="number" id="bathrooms" min="0" />
        </div>

        <div class="form-group">
          <label id="lblDirection">ទិស</label>
          <select id="direction">
            <option value="មិនបញ្ជាក់">មិនបញ្ជាក់</option>
            <option value="កើត">កើត (East)</option>
            <option value="លិច">លិច (West)</option>
            <option value="ត្បូង">ត្បូង (South)</option>
            <option value="ជើង">ជើង (North)</option>
            <option value="កើតឈៀងត្បូង">កើតឈៀងត្បូង (Southeast)</option>
            <option value="កើតឈៀងជើង">កើតឈៀងជើង (Northeast)</option>
            <option value="លិចឈៀងត្បូង">លិចឈៀងត្បូង (Southwest)</option>
            <option value="លិចឈៀងជើង">លិចឈៀងជើង (Northwest)</option>
          </select>
        </div>

        <!-- Conditional Sale Section -->
        <div id="saleFields">
          <div class="form-group">
            <label id="lblCertificate">ប្រភេទប្លង់</label>
            <select id="certificate" onchange="toggleCertOther()">
              <option value="ប្លង់រឹង">ប្លង់រឹង (Hard Title)</option>
              <option value="ប្លង់ទន់">ប្លង់ទន់ (Soft Title)</option>
              <option value="ប្លង់ផ្ទេរសិទ្ធិ">ប្លង់ផ្ទេរសិទ្ធិ</option>
              <option value="ប្រភេទផ្សេង">ប្រភេទផ្សេង (Other)</option>
            </select>
          </div>
          <div class="form-group hidden" id="certOtherGroup">
            <input type="text" id="certOther" placeholder="បញ្ជាក់ប្រភេទប្លង់" />
          </div>
        </div>

        <!-- Conditional Rent Section -->
        <div id="rentFields" class="hidden">
          <div class="form-group">
            <label id="lblDeposit">ប្រាក់កក់</label>
            <select id="deposit" onchange="toggleDepositOther()">
              <option value="1 ខែ">1 ខែ</option>
              <option value="2 ខែ">2 ខែ</option>
              <option value="3 ខែ">3 ខែ</option>
              <option value="ផ្សេងៗ">ផ្សេងៗ (Other)</option>
            </select>
          </div>
          <div class="form-group hidden" id="depositOtherGroup">
            <input type="text" id="depositOther" placeholder="បញ្ជាក់ចំនួនប្រាក់កក់" />
          </div>
          <div class="form-group">
            <label id="lblRentFee">ថ្លៃសេវាជួល/ការថែទាំ</label>
            <input type="text" id="rentFee" />
          </div>
          <div class="form-group">
            <label id="lblContract">រយៈពេលកិច្ចសន្យា</label>
            <input type="text" id="contract" placeholder="ឧទាហរណ៍: 1 ឆ្នាំ" />
          </div>
        </div>

        <div class="form-group">
          <label id="lblDescription">ពិពណ៌នាបន្ថែម</label>
          <textarea id="description" placeholder="ព័ត៌មានបន្ថែមពីអចលនទ្រព្យ..."></textarea>
        </div>
      </div>

      <!-- Photo Upload Section -->
      <div class="card">
        <label><span id="lblPhotos">រូបថតអចលនទ្រព្យ</span> <span class="required">*</span></label>
        <div class="photo-upload-container" onclick="document.getElementById('fileInput').click()">
          <p id="uploadText">📁 ចុចដើម្បីជ្រើសរើសរូបថត</p>
          <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event)" />
        </div>
        <div class="photo-preview-grid" id="previewGrid"></div>
      </div>

      <button type="submit" class="submit-btn" id="btnSubmit">បញ្ជូនអចលនទ្រព្យ</button>
    </form>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let currentLang = 'km';
    let selectedFiles = [];

    const translations = {
      km: {
        pageTitle: "បន្ថែមអចលនទ្រព្យ",
        lblOwnerName: "ឈ្មោះម្ចាស់អចលនទ្រព្យ",
        lblTel1: "លេខទូរស័ព្ទទី១",
        lblTel2: "លេខទូរស័ព្ទទី២ (បើមាន)",
        lblTelegram: "Telegram (បើមាន)",
        lblListingType: "ប្រភេទប្រតិបត្តិការ",
        lblPropertyType: "ប្រភេទអចលនទ្រព្យ",
        lblPrice: "តម្លៃ ($)",
        lblLocation: "ទីតាំង / តំបន់",
        lblMapLink: "តំណភ្ជាប់ Google Map",
        lblLandSize: "ទំហំដី (m²)",
        lblHouseSize: "ទំហំផ្ទះ (m²)",
        lblFrontSpace: "ដីសល់ខាងមុខ",
        lblBackSpace: "ដីសល់ខាងក្រោយ",
        lblBedrooms: "បន្ទប់គេង",
        lblBathrooms: "បន្ទប់ទឹក",
        lblDirection: "ទិស",
        lblCertificate: "ប្រភេទប្លង់",
        lblDeposit: "ប្រាក់កក់",
        lblRentFee: "ថ្លៃសេវាជួល/ការថែទាំ",
        lblContract: "រយៈពេលកិច្ចសន្យា",
        lblDescription: "ពិពណ៌នាបន្ថែម",
        lblPhotos: "រូបថតអចលនទ្រព្យ",
        uploadText: "📁 ចុចដើម្បីជ្រើសរើសរូបថត",
        btnSubmit: "បញ្ជូនអចលនទ្រព្យ",
        minImgAlert: "សូមជ្រើសរើសរូបថតយ៉ាងហោចណាស់ ១ សន្លឹក!",
        successAlert: "អចលនទ្រព្យត្រូវបានបញ្ជូនដោយជោគជ័យ!",
        errorAlert: "មានបញ្ហាក្នុងការបញ្ជូន! សូមព្យាយាមម្តងទៀត។"
      },
      en: {
        pageTitle: "Add New Property",
        lblOwnerName: "Owner Name",
        lblTel1: "Primary Phone",
        lblTel2: "Secondary Phone (Optional)",
        lblTelegram: "Telegram (Optional)",
        lblListingType: "Listing Type",
        lblPropertyType: "Property Type",
        lblPrice: "Price ($)",
        lblLocation: "Location / Area",
        lblMapLink: "Google Map Link",
        lblLandSize: "Land Size (m²)",
        lblHouseSize: "House Size (m²)",
        lblFrontSpace: "Front Space",
        lblBackSpace: "Back Space",
        lblBedrooms: "Bedrooms",
        lblBathrooms: "Bathrooms",
        lblDirection: "Direction",
        lblCertificate: "Title Type",
        lblDeposit: "Security Deposit",
        lblRentFee: "Management/Rent Fee",
        lblContract: "Contract Term",
        lblDescription: "Additional Description",
        lblPhotos: "Property Photos",
        uploadText: "📁 Click to upload photos",
        btnSubmit: "Submit Listing",
        minImgAlert: "Please select at least 1 photo!",
        successAlert: "Property submitted successfully!",
        errorAlert: "Submission failed! Please try again."
      }
    };

    function switchLanguage(lang) {
      currentLang = lang;
      document.getElementById('btnKm').classList.toggle('active', lang === 'km');
      document.getElementById('btnEn').classList.toggle('active', lang === 'en');

      const t = translations[lang];
      for (const key in t) {
        const el = document.getElementById(key);
        if (el) {
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.placeholder = t[key];
          } else {
            el.innerText = t[key];
          }
        }
      }
    }

    function handleListingTypeChange() {
      const type = document.getElementById('listingType').value;
      const isRent = type === 'ជួល' || type === 'Rent';
      document.getElementById('rentFields').classList.toggle('hidden', !isRent);
      document.getElementById('saleFields').classList.toggle('hidden', isRent);
    }

    function toggleCertOther() {
      const val = document.getElementById('certificate').value;
      const isOther = val === 'ប្រភេទផ្សេង' || val === 'Other';
      document.getElementById('certOtherGroup').classList.toggle('hidden', !isOther);
    }

    function toggleDepositOther() {
      const val = document.getElementById('deposit').value;
      const isOther = val === 'ផ្សេងៗ' || val === 'Other';
      document.getElementById('depositOtherGroup').classList.toggle('hidden', !isOther);
    }

    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      selectedFiles = selectedFiles.concat(files);
      renderPreviews();
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderPreviews();
    }

    function renderPreviews() {
      const grid = document.getElementById('previewGrid');
      grid.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';

        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'remove-btn';
        btn.innerHTML = '✕';
        btn.onclick = (e) => {
          e.stopPropagation();
          removeFile(index);
        };

        item.appendChild(img);
        item.appendChild(btn);
        grid.appendChild(item);
      });
    }

    async function submitForm() {
      const t = translations[currentLang];
      const form = document.getElementById('listingForm');

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (selectedFiles.length === 0) {
        tg?.showAlert ? tg.showAlert(t.minImgAlert) : alert(t.minImgAlert);
        return;
      }

      const submitBtn = document.getElementById('btnSubmit');
      submitBtn.disabled = true;

      if (tg) tg.MainButton?.showProgress();

      const user = tg?.initDataUnsafe?.user;
      const submittedBy = user 
        ? `${user.first_name || ''} ${user.last_name || ''} (@${user.username || 'no_username'})`.trim() 
        : 'Web User';

      const formData = new FormData();
      formData.append('submittedBy', submittedBy);
      formData.append('ownerName', document.getElementById('ownerName').value);
      formData.append('tel1', document.getElementById('tel1').value);
      formData.append('tel2', document.getElementById('tel2').value);
      formData.append('telegram', document.getElementById('telegram').value);
      formData.append('listingType', document.getElementById('listingType').value);
      formData.append('propertyType', document.getElementById('propertyType').value);
      formData.append('price', document.getElementById('price').value);
      formData.append('location', document.getElementById('location').value);
      formData.append('mapLink', document.getElementById('mapLink').value);
      formData.append('landSize', document.getElementById('landSize').value);
      formData.append('houseSize', document.getElementById('houseSize').value);
      formData.append('frontSpace', document.getElementById('frontSpace').value);
      formData.append('backSpace', document.getElementById('backSpace').value);
      formData.append('bedrooms', document.getElementById('bedrooms').value);
      formData.append('bathrooms', document.getElementById('bathrooms').value);
      formData.append('direction', document.getElementById('direction').value);

      const listingType = document.getElementById('listingType').value;
      if (listingType === 'ជួល' || listingType === 'Rent') {
        const depositVal = document.getElementById('deposit').value;
        formData.append('deposit', (depositVal === 'ផ្សេងៗ' || depositVal === 'Other') ? document.getElementById('depositOther').value : depositVal);
        formData.append('rentFee', document.getElementById('rentFee').value);
        formData.append('contract', document.getElementById('contract').value);
      } else {
        const certVal = document.getElementById('certificate').value;
        formData.append('certificate', (certVal === 'ប្រភេទផ្សេង' || certVal === 'Other') ? document.getElementById('certOther').value : certVal);
      }

      formData.append('description', document.getElementById('description').value);

      selectedFiles.forEach((file) => {
        formData.append('photos', file);
      });

      try {
        // Replace with your actual Render API URL endpoint
        const response = await fetch('https://twenty5realty-form.onrender.com/api/submit-property', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          if (tg?.showAlert) {
            tg.showAlert(t.successAlert, () => tg.close());
          } else {
            alert(t.successAlert);
          }
        } else {
          throw new Error(`Server returned status ${response.status}`);
        }
      } catch (err) {
        console.error("Submission error:", err);
        tg?.showAlert ? tg.showAlert(t.errorAlert) : alert(t.errorAlert);
      } finally {
        submitBtn.disabled = false;
        if (tg) tg.MainButton?.hideProgress();
      }
    }
  </script>
</body>
</html>
