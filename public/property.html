<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Listing</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #0088cc;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
      --error-color: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .lang-switch {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lang-btn {
      border: 1px solid var(--border-color);
      background: none;
      padding: 4px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .lang-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
    }

    .section-title {
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .form-group {
      flex: 1;
    }

    .upload-box {
      border: 2px dashed var(--border-color);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      background: #f1f5f9;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    .remove-btn {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--error-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .map-notice {
      color: var(--error-color);
      font-size: 12px;
      margin-top: 4px;
    }

    .submit-btn-wrapper {
      margin-top: 24px;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="lang-switch">
      <button type="button" class="lang-btn" id="btn-km" onclick="switchLanguage('km')">ខ្មែរ</button>
      <button type="button" class="lang-btn" id="btn-en" onclick="switchLanguage('en')">EN</button>
    </div>

    <h2 id="header-title">🏠 ចុះបញ្ជីអចលនទ្រព្យ</h2>
    <div class="subtitle" id="header-subtitle">ទម្រង់បែបបទដាក់អចលនទ្រព្យលក់/ជួល</div>

    <form id="listingForm" onsubmit="event.preventDefault(); submitForm();">
      <!-- Owner Information -->
      <div class="section-title" id="sec-owner">👤 ព័ត៌មានម្ចាស់អចលនទ្រព្យ</div>
      
      <div class="form-group">
        <label id="lbl-ownerName">ឈ្មោះម្ចាស់ *</label>
        <input type="text" id="ownerName" required data-ph-km="បញ្ចូលឈ្មោះម្ចាស់" data-ph-en="Enter owner name" />
      </div>

      <div class="row">
        <div class="form-group">
          <label id="lbl-tel1">លេខទូរស័ព្ទទី១ *</label>
          <input type="tel" id="tel1" required data-ph-km="012345678" data-ph-en="012345678" />
        </div>
        <div class="form-group">
          <label id="lbl-tel2">លេខទូរស័ព្ទទី២</label>
          <input type="tel" id="tel2" data-ph-km="098765432" data-ph-en="098765432" />
        </div>
      </div>

      <div class="form-group">
        <label id="lbl-telegram">Telegram ម្ចាស់</label>
        <input type="text" id="telegram" data-ph-km="@username ឬ លេខទូរស័ព្ទ" data-ph-en="@username or Phone" />
      </div>

      <!-- Property Details -->
      <div class="section-title" id="sec-details">🏠 ព័ត៌មានអចលនទ្រព្យ</div>

      <div class="row">
        <div class="form-group">
          <label id="lbl-listingType">គោលបំណង *</label>
          <select id="listingType" required onchange="togglePurposeSections()">
            <option value="" id="opt-list-select">-- ជ្រើសរើស --</option>
            <option value="លក់" id="opt-list-sale">លក់</option>
            <option value="ជួល" id="opt-list-rent">ជួល</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lbl-propertyType">ប្រភេទអចលនទ្រព្យ *</label>
          <select id="propertyType" required>
            <option value="" id="opt-type-select">-- ជ្រើសរើស --</option>
            <option value="ផ្ទះល្វែង" id="opt-type-flat">ផ្ទះល្វែង</option>
            <option value="វីឡា" id="opt-type-villa">វីឡា</option>
            <option value="ខុនដូ" id="opt-type-condo">ខុនដូ</option>
            <option value="ដី" id="opt-type-land">ដី</option>
            <option value="ឃ្លាំង" id="opt-type-warehouse">ឃ្លាំង</option>
            <option value="អាជីវកម្ម" id="opt-type-business">អាជីវកម្ម</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label id="lbl-price">តម្លៃ ($) *</label>
        <input type="number" id="price" required data-ph-km="ឧទាហរណ៍៖ 50000" data-ph-en="e.g. 50000" />
      </div>

      <div class="form-group">
        <label id="lbl-location">ទីតាំង / អាសយដ្ឋាន *</label>
        <input type="text" id="location" required data-ph-km="ខណ្ឌ/ក្រុង, រាជធានី/ខេត្ត" data-ph-en="District, Province/City" />
      </div>

      <div class="form-group">
        <label id="lbl-mapLink">📍 លីង Google Maps (Google Maps Link) *</label>
        <input type="url" id="mapLink" required onchange="previewMap()" data-ph-km="https://maps.google.com/..." data-ph-en="https://maps.google.com/..." />
        <div class="map-notice" id="notice-mapLink">⚠️ សូមបញ្ចូល/ចម្លងលីង Google Maps ទីតាំងអចលនទ្រព្យដើម្បីបន្ត!</div>
      </div>

      <div id="map-container" style="display:none; margin-bottom: 16px;">
        <iframe id="map-iframe" width="100%" height="200" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <div class="row">
        <div class="form-group">
          <label id="lbl-landSize">ទំហំដី</label>
          <input type="text" id="landSize" data-ph-km="ឧ. 10m x 20m" data-ph-en="e.g. 10m x 20m" />
        </div>
        <div class="form-group">
          <label id="lbl-houseSize">ទំហំផ្ទះ</label>
          <input type="text" id="houseSize" data-ph-km="ឧ. 4m x 12m" data-ph-en="e.g. 4m x 12m" />
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label id="lbl-frontSpace">សល់មុខផ្ទះ (Front Space)</label>
          <input type="text" id="frontSpace" data-ph-km="ឧ. 5m" data-ph-en="e.g. 5m" />
        </div>
        <div class="form-group">
          <label id="lbl-backSpace">សល់ក្រោយផ្ទះ (Back Space)</label>
          <input type="text" id="backSpace" data-ph-km="ឧ. 2m" data-ph-en="e.g. 2m" />
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label id="lbl-bedrooms">បន្ទប់គេង</label>
          <select id="bedrooms">
            <option value="" id="opt-bed-select">-- ជ្រើសរើស --</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5+">5+</option>
          </select>
        </div>
        <div class="form-group">
          <label id="lbl-bathrooms">បន្ទប់ទឹក</label>
          <select id="bathrooms">
            <option value="" id="opt-bath-select">-- ជ្រើសរើស --</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5+">5+</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label id="lbl-direction">ទិស</label>
        <select id="direction">
          <option value="" id="opt-dir-select">-- ជ្រើសរើស --</option>
          <option value="កើត" id="opt-dir-east">កើត</option>
          <option value="លិច" id="opt-dir-west">លិច</option>
          <option value="ត្បូង" id="opt-dir-south">ត្បូង</option>
          <option value="ជើង" id="opt-dir-north">ជើង</option>
          <option value="កើតត្បូង" id="opt-dir-se">កើតត្បូង</option>
          <option value="កើតជើង" id="opt-dir-ne">កើតជើង</option>
          <option value="លិចត្បូង" id="opt-dir-sw">លិចត្បូង</option>
          <option value="លិចជើង" id="opt-dir-nw">លិចជើង</option>
        </select>
      </div>

      <!-- Rent Terms Section -->
      <div id="rent-terms-section" style="display: none;">
        <div class="row">
          <div class="form-group">
            <label id="lbl-deposit">ប្រាក់កក់ *</label>
            <select id="deposit" onchange="toggleDepositOther()">
              <option value="1 ខែ" id="opt-dep-1">1 ខែ</option>
              <option value="2 ខែ" id="opt-dep-2">2 ខែ</option>
              <option value="3 ខែ" id="opt-dep-3">3 ខែ</option>
              <option value="ផ្សេងៗ" id="opt-dep-other">ផ្សេងៗ</option>
            </select>
            <input type="text" id="depositOther" style="display:none; margin-top: 6px;" placeholder="បញ្ជាក់ប្រាក់កក់" />
          </div>

          <div class="form-group">
            <label id="lbl-rentFee">បង់ថ្លៃឈ្នួល *</label>
            <select id="rentFee">
              <option value="ដើមខែ" id="opt-fee-start">ដើមខែ</option>
              <option value="ចុងខែ" id="opt-fee-end">ចុងខែ</option>
              <option value="ចរចា" id="opt-fee-neg">ចរចា</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label id="lbl-contract">កុងត្រា *</label>
          <select id="contract">
            <option value="3 ខែ" id="opt-con-3m">3 ខែ</option>
            <option value="6 ខែ" id="opt-con-6m">6 ខែ</option>
            <option value="1 ឆ្នាំ" id="opt-con-1y">1 ឆ្នាំ</option>
            <option value="2 ឆ្នាំ" id="opt-con-2y">2 ឆ្នាំ</option>
            <option value="3 ឆ្នាំ" id="opt-con-3y">3 ឆ្នាំ</option>
            <option value="ចរចា" id="opt-con-neg">ចរចា</option>
          </select>
        </div>
      </div>

      <!-- Sale Terms Section -->
      <div id="sale-terms-section" style="display: none;">
        <div class="form-group">
          <label id="lbl-certificate">ប្លង់កម្មសិទ្ធ *</label>
          <select id="certificate" onchange="toggleCertOther()">
            <option value="មិនមាន" id="opt-cert-none">មិនមាន</option>
            <option value="ប្លង់រឹង" id="opt-cert-hard">ប្លង់រឹង</option>
            <option value="ប្លង់ទន់" id="opt-cert-soft">ប្លង់ទន់</option>
            <option value="ប្រភេទផ្សេង" id="opt-cert-other">ប្រភេទផ្សេង</option>
          </select>
          <input type="text" id="certOther" style="display:none; margin-top: 6px;" placeholder="បញ្ជាក់ប្រភេទប្លង់" />
        </div>
      </div>

      <div class="form-group">
        <label id="lbl-description">សម្គាល់បន្ថែម</label>
        <textarea id="description" rows="3" data-ph-km="ព័ត៌មានបន្ថែមផ្សេងៗ..." data-ph-en="Additional details..."></textarea>
      </div>

      <!-- Image Upload Section -->
      <div class="form-group">
        <label id="lbl-images">🖼️ រូបភាពអចលនទ្រព្យ (អតិបរមា 10) *</label>
        <div class="upload-box" onclick="document.getElementById('imageInput').click()">
          <span id="upload-text">ចុចទីនេះដើម្បីជ្រើសរើសរូបភាព *</span>
          <input type="file" id="imageInput" multiple accept="image/*" style="display: none;" onchange="handleFileSelect(event)" />
          <div id="upload-count" style="margin-top: 6px; font-size: 12px; color: #64748b;">គ្មានរូបភាពត្រូវបានជ្រើសរើស</div>
        </div>
        <div class="preview-grid" id="preview-grid"></div>
      </div>

      <div class="submit-btn-wrapper">
        <button type="submit" class="submit-btn" id="btn-submit">SUBMIT LISTING</button>
      </div>
    </form>
  </div>

    function togglePurposeSections() {
      const listingType = document.getElementById('listingType').value;
      const rentSection = document.getElementById('rent-terms-section');
      const saleSection = document.getElementById('sale-terms-section');

      if (listingType === 'ជួល' || listingType === 'For Rent') {
        rentSection.style.display = 'block';
        saleSection.style.display = 'none';
      } else if (listingType === 'លក់' || listingType === 'For Sale') {
        saleSection.style.display = 'block';
        rentSection.style.display = 'none';
      } else {
        rentSection.style.display = 'none';
        saleSection.style.display = 'none';
      }
    }

    function toggleDepositOther() {
      const depositVal = document.getElementById('deposit').value;
      const otherInput = document.getElementById('depositOther');
      if (depositVal === 'ផ្សេងៗ' || depositVal === 'Other' || depositVal === 'optDepOther') {
        otherInput.style.display = 'block';
        otherInput.required = true;
      } else {
        otherInput.style.display = 'none';
        otherInput.required = false;
        otherInput.value = '';
      }
    }

    function toggleCertOther() {
      const certVal = document.getElementById('certificate').value;
      const otherInput = document.getElementById('certOther');
      if (certVal === 'ប្រភេទផ្សេង' || certVal === 'Other type' || certVal === 'optCertOther') {
        otherInput.style.display = 'block';
        otherInput.required = true;
      } else {
        otherInput.style.display = 'none';
        otherInput.required = false;
        otherInput.value = '';
      }
    }

    function previewMap() {
      const url = document.getElementById('mapLink').value.trim();
      const container = document.getElementById('map-container');
      const iframe = document.getElementById('map-iframe');

      if (!url) {
        container.style.display = 'none';
        iframe.src = '';
        return;
      }

      let embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(url)}&output=embed`;
      iframe.src = embedUrl;
      container.style.display = 'block';
    }

    function handleFileSelect(event) {
      const newFiles = Array.from(event.target.files);
      const t = translations[currentLang];

      if (selectedFiles.length + newFiles.length > 10) {
        tg?.showAlert ? tg.showAlert(t.limitAlert) : alert(t.limitAlert);
        return;
      }

      selectedFiles = selectedFiles.concat(newFiles);
      event.target.value = '';
      renderPreviews();
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderPreviews();
    }

    function renderPreviews() {
      const grid = document.getElementById('preview-grid');
      const countLabel = document.getElementById('upload-count');
      const t = translations[currentLang];
      grid.innerHTML = '';

      if (selectedFiles.length === 0) {
        countLabel.textContent = t.noImages;
      } else {
        countLabel.textContent = `${t.imgCountText} ${selectedFiles.length} ${currentLang === 'km' ? 'រូប' : 'image(s)'}`;
      }

      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';

        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.onload = () => URL.revokeObjectURL(img.src);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.type = 'button';
        removeBtn.innerHTML = '✕';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          removeFile(index);
        };

        item.appendChild(img);
        item.appendChild(removeBtn);
        grid.appendChild(item);
      });
    }

    const submitForm = async () => {
      const t = translations[currentLang];
      const form = document.getElementById('listingForm');

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (selectedFiles.length === 0) {
        tg?.showAlert ? tg.showAlert(t.minImgAlert) : alert(t.minImgAlert);
        return;
      }

      if (tg) tg.MainButton.showProgress();

      const user = tg?.initDataUnsafe?.user;
      const submittedBy = user ? `${user.first_name || ''} ${user.last_name || ''} (@${user.username || 'no_username'})`.trim() : 'Web User';

      const listingTypeVal = document.getElementById('listingType').value;
      const depositVal = document.getElementById('deposit').value;
      const certVal = document.getElementById('certificate').value;

      const payload = {
        submittedBy,
        ownerName: document.getElementById('ownerName').value,
        tel1: document.getElementById('tel1').value,
        tel2: document.getElementById('tel2').value,
        telegram: document.getElementById('telegram').value,
        listingType: listingTypeVal,
        propertyType: document.getElementById('propertyType').value,
        price: document.getElementById('price').value,
        location: document.getElementById('location').value,
        mapLink: document.getElementById('mapLink').value,
        landSize: document.getElementById('landSize').value,
        houseSize: document.getElementById('houseSize').value,
        frontSpace: document.getElementById('frontSpace').value,
        backSpace: document.getElementById('backSpace').value,
        bedrooms: document.getElementById('bedrooms').value,
        bathrooms: document.getElementById('bathrooms').value,
        direction: document.getElementById('direction').value,
        description: document.getElementById('description').value,
        deposit: depositVal === 'ផ្សេងៗ' || depositVal === 'Other' ? document.getElementById('depositOther').value : depositVal,
        rentFee: document.getElementById('rentFee').value,
        contract: document.getElementById('contract').value,
        certificate: certVal === 'ប្រភេទផ្សេង' || certVal === 'Other type' ? document.getElementById('certOther').value : certVal
      };

      try {
        if (tg && tg.sendData) {
          tg.sendData(JSON.stringify(payload));
        } else {
          tg?.showAlert ? tg.showAlert(t.successAlert) : alert(t.successAlert);
        }
      } catch (err) {
        tg?.showAlert ? tg.showAlert(t.errorAlert) : alert(t.errorAlert);
      } finally {
        if (tg) tg.MainButton.hideProgress();
      }
    };

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setBackgroundColor('#f8fafc');
      tg.MainButton.setText(translations[currentLang].submitBtn);
      tg.MainButton.show();
      tg.MainButton.onClick(submitForm);
    }

    switchLanguage(currentLang);
  </script>
