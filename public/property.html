<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twenty5 Realty - Property Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #007bf5;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bf5;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    button:disabled {
      background-color: #cccccc;
    }
    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🏠 ចុះបញ្ជីអចលនទ្រព្យ / Property Listing</h2>
  
  <form id="propertyForm">
    <!-- Owner Info -->
    <div class="form-group">
      <label>ឈ្មោះម្ចាស់ / Owner Name *</label>
      <input type="text" id="ownerName" required>
    </div>

    <div class="form-group">
      <label>លេខទូរស័ព្ទ ១ / Tel 1 *</label>
      <input type="tel" id="tel1" required>
    </div>

    <div class="form-group">
      <label>លេខទូរស័ព្ទ ២ / Tel 2</label>
      <input type="tel" id="tel2">
    </div>

    <div class="form-group">
      <label>Telegram</label>
      <input type="text" id="telegram">
    </div>

    <!-- Property Details -->
    <div class="form-group">
      <label>គោលបំណង / Purpose *</label>
      <select id="listingType" required>
        <option value="ជួល">ជួល / For Rent</option>
        <option value="លក់">លក់ / For Sale</option>
      </select>
    </div>

    <div class="form-group">
      <label>ប្រភេទ / Property Type *</label>
      <input type="text" id="propertyType" placeholder="ឧ. ផ្ទះល្វែង, ដី, ខុនដូ" required>
    </div>

    <div class="form-group">
      <label>តម្លៃ ($) / Price ($) *</label>
      <input type="number" id="price" required>
    </div>

    <div class="form-group">
      <label>ទីតាំង / Location *</label>
      <input type="text" id="location" required>
    </div>

    <div class="form-group">
      <label>Google Maps Link</label>
      <input type="url" id="mapLink">
    </div>

    <!-- Dimensions -->
    <div class="form-group">
      <label>ទំហំដី / Land Size</label>
      <input type="text" id="landSize" placeholder="ឧ. 4.2x20">
    </div>

    <div class="form-group">
      <label>ទំហំផ្ទះ / House Size</label>
      <input type="text" id="houseSize" placeholder="ឧ. 4.2x15">
    </div>

    <div class="form-group">
      <label>សល់មុខផ្ទះ / Front Space</label>
      <input type="text" id="frontSpace">
    </div>

    <div class="form-group">
      <label>សល់ក្រោយ / Back Space</label>
      <input type="text" id="backSpace">
    </div>

    <div class="form-group">
      <label>បន្ទប់គេង / Bedrooms</label>
      <input type="text" id="bedrooms">
    </div>

    <div class="form-group">
      <label>បន្ទប់ទឹក / Bathrooms</label>
      <input type="text" id="bathrooms">
    </div>

    <div class="form-group">
      <label>ទិស / Direction</label>
      <input type="text" id="direction">
    </div>

    <!-- Terms & ID -->
    <div class="form-group">
      <label>ប្រាក់កក់ / Deposit</label>
      <input type="text" id="deposit">
    </div>

    <div class="form-group">
      <label>ថ្លៃឈ្នួល / Rent Fee</label>
      <input type="text" id="rentFee">
    </div>

    <div class="form-group">
      <label>កុងត្រា / Contract</label>
      <input type="text" id="contract">
    </div>

    <div class="form-group">
      <label>ប្លង់កម្មសិទ្ធ / Certificate</label>
      <input type="text" id="certificate">
    </div>

    <div class="form-group">
      <label>Property ID</label>
      <input type="text" id="propertyId">
    </div>

    <div class="form-group">
      <label>កំណត់សម្គាល់បន្ថែម / Additional Notes</label>
      <textarea id="description" rows="3"></textarea>
    </div>

    <div class="form-group">
      <label>អ្នកបញ្ចូល / Submitted By</label>
      <input type="text" id="submittedBy" placeholder="ឧ. Admin / Telegram Username">
    </div>

    <!-- Photos Upload -->
    <div class="form-group">
      <label>រូបភាព / Photos (Max 10)</label>
      <input type="file" id="photoInput" accept="image/*" multiple>
    </div>

    <button type="submit" id="submitBtn">SUBMIT LISTING</button>
  </form>

  <div id="statusMessage"></div>
</div>

<script>
  // Convert selected images to Base64 arrays
  const convertFilesToBase64 = (files) => {
    return Promise.all(Array.from(files).map(file => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          name: file.name,
          data: reader.result.split(',')[1] // Strip base64 metadata prefix
        });
        reader.onerror = error => reject(error);
      });
    }));
  };

  document.getElementById('propertyForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    statusMsg.style.color = '#333';
    statusMsg.textContent = 'Processing submission...';

    try {
      const fileInput = document.getElementById('photoInput');
      let base64Photos = [];
      
      if (fileInput.files.length > 0) {
        base64Photos = await convertFilesToBase64(fileInput.files);
      }

      // JSON Payload matching client.html structure
      const payload = {
        ownerName: document.getElementById('ownerName').value,
        tel1: document.getElementById('tel1').value,
        tel2: document.getElementById('tel2').value,
        telegram: document.getElementById('telegram').value,
        listingType: document.getElementById('listingType').value,
        propertyType: document.getElementById('propertyType').value,
        price: document.getElementById('price').value,
        location: document.getElementById('location').value,
        mapLink: document.getElementById('mapLink').value,
        landSize: document.getElementById('landSize').value,
        houseSize: document.getElementById('houseSize').value,
        frontSpace: document.getElementById('frontSpace').value,
        backSpace: document.getElementById('backSpace').value,
        bedrooms: document.getElementById('bedrooms').value,
        bathrooms: document.getElementById('bathrooms').value,
        direction: document.getElementById('direction').value,
        deposit: document.getElementById('deposit').value,
        rentFee: document.getElementById('rentFee').value,
        contract: document.getElementById('contract').value,
        certificate: document.getElementById('certificate').value,
        propertyId: document.getElementById('propertyId').value,
        description: document.getElementById('description').value,
        submittedBy: document.getElementById('submittedBy').value,
        photos: base64Photos
      };

      const response = await fetch('/api/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (response.ok && result.success) {
        statusMsg.style.color = 'green';
        statusMsg.textContent = '✅ Property submitted successfully!';
        document.getElementById('propertyForm').reset();
      } else {
        statusMsg.style.color = 'red';
        statusMsg.textContent = '❌ Error: ' + (result.error || 'Submission failed.');
      }
    } catch (err) {
      statusMsg.style.color = 'red';
      statusMsg.textContent = '❌ Failed to connect to server.';
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'SUBMIT LISTING';
    }
  });
</script>

</body>
</html>
